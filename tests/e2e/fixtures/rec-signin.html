<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in (another origin)</title></head>
<body style="font:15px system-ui;padding:40px">
  <h1>Sign in</h1>
  <a id="back">Back to the app</a>
  <script>
    // Back to the app's origin, on page B (the app's origin is passed in ?to=).
    document.getElementById('back').href = new URLSearchParams(location.search).get('to');
  </script>
</body></html>
