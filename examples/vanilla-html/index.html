<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>trace-avatar · vanilla example</title>
  <style>
    :root { --ta-color: #2456d8; color-scheme: light dark; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    main { max-width: 560px; margin: 32px auto; padding: 0 16px; display: grid; gap: 14px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    input { font: inherit; padding: 10px 12px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); border-radius: 8px; background: Canvas; color: CanvasText; }
    button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 0; background: #2456d8; color: #fff; cursor: pointer; }
    .total { display: flex; justify-content: space-between; font-size: 18px; padding: 12px 0; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  </style>
</head>
<body>
  <header>
    <strong>Invoices</strong>
    <button data-testid="new-invoice">New invoice</button>
  </header>
  <main>
    <label>Customer <input id="customer" placeholder="Who is it for?"></label>
    <label>Amount (₦) <input id="amount" inputmode="numeric"></label>
    <div class="total"><span>Total</span><span id="total">₦0</span></div>
    <button id="send">Send invoice</button>
  </main>
  <script>
    const amount = document.getElementById('amount');
    amount.addEventListener('input', () => { document.getElementById('total').textContent = '₦' + Number(amount.value || 0).toLocaleString(); });
  </script>
  <!-- From a CDN: https://cdn.jsdelivr.net/npm/trace-avatar/dist/trace.min.js -->
  <script src="../../dist/trace.min.js"></script>
  <script>
    TraceAvatar.createTrace({ trace: './demo.trace.json', controls: true, autoplay: true });
  </script>
</body>
</html>
